# Copy to secret.yaml, set real values, then: kubectl apply -n <ns> -f secret.yaml
# secret.yaml is git-ignored.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: admin
  MONGO_INITDB_ROOT_PASSWORD: change-me
  MONGO_INITDB_DATABASE: app
