# Set host / ingressClassName for your cluster. Uncomment tls once a cert exists.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
spec:
  ingressClassName: nginx
  rules:
    - host: nginx.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  name: http
  # tls:
  #   - hosts: [nginx.example.com]
  #     secretName: nginx-tls
