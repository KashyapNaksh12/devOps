# Copy to secret.yaml, set real values, then: kubectl apply -n <ns> -f secret.yaml
# secret.yaml is git-ignored. Used by both SonarQube and its Postgres.
apiVersion: v1
kind: Secret
metadata:
  name: sonarqube-db-secret
type: Opaque
stringData:
  POSTGRES_USER: sonar
  POSTGRES_PASSWORD: change-me
  POSTGRES_DB: sonar
