# Set host / ingressClassName for your cluster. Uncomment tls once a cert exists.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarqube
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
spec:
  ingressClassName: nginx
  rules:
    - host: sonarqube.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarqube
                port:
                  name: http
  # tls:
  #   - hosts: [sonarqube.example.com]
  #     secretName: sonarqube-tls
