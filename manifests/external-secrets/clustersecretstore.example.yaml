# Example ClusterSecretStore for the External Secrets Operator (https://external-secrets.io), backed by
# AWS Secrets Manager. Swap `provider` for Vault, GCP, Azure, ... Install the operator first.
# Apply once per cluster, then use ExternalSecrets like overlays/prod/externalsecrets.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            namespace: external-secrets
            key: access-key
          secretAccessKeySecretRef:
            name: aws-credentials
            namespace: external-secrets
            key: secret-access-key
