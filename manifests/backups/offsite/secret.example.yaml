# Copy to secret.yaml, set real values, then: kubectl apply -n <ns> -f secret.yaml
# secret.yaml is git-ignored. Create a dedicated MinIO user/key with write access to the backups bucket.
# For AWS S3 use: https://ACCESS_KEY:SECRET_KEY@s3.amazonaws.com
apiVersion: v1
kind: Secret
metadata:
  name: offsite-backup-secret
type: Opaque
stringData:
  MC_HOST_offsite: http://backup-user:change-me@minio.example.svc.cluster.local:9000
