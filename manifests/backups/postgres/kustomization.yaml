# Nightly dump of manifests/postgres into a PVC. Apply in the same namespace as postgres.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: postgres-backup
      app.kubernetes.io/part-of: common
    includeSelectors: true
resources:
  - pvc.yaml
  - cronjob.yaml
