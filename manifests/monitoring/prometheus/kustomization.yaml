apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/part-of: monitoring
    includeSelectors: true
resources:
  - rbac.yaml
  - service.yaml
  - statefulset.yaml
# Generated with a hash suffix so editing prometheus.yml rolls the pod.
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
