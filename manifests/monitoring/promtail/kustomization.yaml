# Ships container logs from every node to Loki.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: promtail
      app.kubernetes.io/part-of: monitoring
    includeSelectors: true
resources:
  - rbac.yaml
  - daemonset.yaml
configMapGenerator:
  - name: promtail-config
    files:
      - promtail.yaml
