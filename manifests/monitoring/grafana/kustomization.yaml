apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/part-of: monitoring
    includeSelectors: true
resources:
  - pvc.yaml
  - service.yaml
  - deployment.yaml
  - ingress.yaml
configMapGenerator:
  - name: grafana-datasources
    files:
      - datasources.yaml
