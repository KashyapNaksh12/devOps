# Set host / ingressClassName for your cluster. Uncomment tls once a cert exists.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
spec:
  ingressClassName: nginx
  rules:
    - host: grafana.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
  # tls:
  #   - hosts: [grafana.example.com]
  #     secretName: grafana-tls
