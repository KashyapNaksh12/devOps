apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: loki
      app.kubernetes.io/part-of: monitoring
    includeSelectors: true
resources:
  - service.yaml
  - statefulset.yaml
configMapGenerator:
  - name: loki-config
    files:
      - loki.yaml
