apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: alertmanager
      app.kubernetes.io/part-of: monitoring
    includeSelectors: true
resources:
  - service.yaml
  - statefulset.yaml
# Generated with a hash suffix so editing alertmanager.yml rolls the pod.
configMapGenerator:
  - name: alertmanager-config
    files:
      - alertmanager.yml
