# Replace the null receiver with a real one (slack_configs, email_configs, webhook_configs...).
# https://prometheus.io/docs/alerting/latest/configuration/
route:
  receiver: default
  group_by: [alertname, namespace]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
