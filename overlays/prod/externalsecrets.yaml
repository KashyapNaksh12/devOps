# Pulls the secrets from the external store instead of `kubectl create secret`.
# Each remote key holds a JSON object with the listed properties. Adjust keys to your store.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets
  target:
    name: postgres-secret
  data:
    - secretKey: POSTGRES_USER
      remoteRef: {key: prod/postgres, property: POSTGRES_USER}
    - secretKey: POSTGRES_PASSWORD
      remoteRef: {key: prod/postgres, property: POSTGRES_PASSWORD}
    - secretKey: POSTGRES_DB
      remoteRef: {key: prod/postgres, property: POSTGRES_DB}
---
apiVersion: external-secrets.io/v1beta1
