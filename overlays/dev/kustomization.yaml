# Dev: single-replica, small volumes, no TLS or backups. Create the secrets first (see manifests/README.md):
#   kubectl create secret generic postgres-secret -n dev ...
#   kubectl create secret generic redis-secret -n dev ...
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
labels:
  - pairs:
      app.kubernetes.io/instance: dev
resources:
  - namespace.yaml
  - ../../manifests/postgres
  - ../../manifests/redis
  - ../../manifests/nginx
  - ../../manifests/network-policies
components:
  - ../../manifests/exporters/postgres
  - ../../manifests/exporters/redis
patches:
  - target: {kind: Deployment, name: nginx}
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target: {kind: Ingress, name: nginx}
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: app.dev.example.com
  - target: {kind: PodDisruptionBudget, name: nginx}
    patch: |
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: nginx
